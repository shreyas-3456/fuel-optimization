services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: fuel_db
      POSTGRES_USER: fuel_user
      POSTGRES_PASSWORD: fuel_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  postgres_data:
  redis_data: